name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 9 * * *'

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # Keep schedule alive 단계에서 워크플로를 다시 켜기 위해

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: npm run sync

      - name: Commit synced content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ public/images/notion/ .notion-sync-cache.json
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: sync content from Notion"
            git pull --rebase origin main
            git push
          fi

      - name: Translate to English
        id: translate
        env:
          OPENCLAW_API_KEY: ${{ secrets.OPENCLAW_API_KEY }}
          OPENCLAW_API_URL: ${{ secrets.OPENCLAW_API_URL }}
          OPENCLAW_MODEL: ${{ secrets.OPENCLAW_MODEL }}
        run: npm run translate
        continue-on-error: true

      - name: Commit translated content
        if: steps.translate.outcome == 'success'
        run: |
          git add src/content/posts-en/ .translation-cache.json
          if git diff --cached --quiet; then
            echo "No translation changes"
          else
            git commit -m "chore: translate content to English [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Keep schedule alive
        # 저장소에 60일 동안 커밋이 없으면 GitHub가 예약 실행을 끈다(2026-08에 실제로 꺼졌었다).
        # 실행할 때마다 이 워크플로를 다시 켜서 그 60일 타이머를 초기화한다.
        if: always()
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/deploy.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
